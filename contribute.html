<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提交网站 - DogNav 狗狗导航</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon"></span>
        <span class="logo-text">Dog<span>Nav</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="links.html">友链</a>
        <a href="about.html">关于</a>
        <a href="contribute.html" class="active">提交</a>
      </div>
      <div class="nav-right">
        <button class="hamburger" id="mobile-toggle" aria-label="菜单"></button>
      </div>
    </div>
  </nav>

  <div class="mobile-nav" id="mobile-nav">
    <button class="mobile-nav-close" id="mobile-close" aria-label="关闭"></button>
    <a href="index.html">首页</a>
    <a href="links.html">友链</a>
    <a href="about.html">关于</a>
    <a href="contribute.html">提交</a>
  </div>

  <section class="page-hero">
    <h1>提交网站</h1>
    <p>发现了好网站？推荐给我们，审核后将会收录到导航中</p>
  </section>

  <div class="page-content">
    <div class="content-card reveal">
      <div class="contribute-cta">
        <div style="display:inline-block;padding:16px;border-radius:50%;background:var(--accent-soft);margin-bottom:8px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="48" height="48" style="color:var(--accent)"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </div>
        <h3>通过 GitHub Issues 提交</h3>
        <p>点击按钮跳转到 GitHub，创建一个新 Issue，填写网站信息即可。我们会定期审核并收录优质网站。</p>
        <a href="https://github.com/BYGD/dog-nav/issues/new?title=提交网站：&body=网站名称：%0A网站链接：%0A网站简介：%0A所属分类：" target="_blank" class="cta-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          提交网站
        </a>
      </div>
    </div>

    <div class="content-card reveal">
      <h2>收录标准</h2>
      <p>我们希望收录的网站满足以下条件：</p>
      <p>1. 网站可正常访问，内容健康合法</p>
      <p>2. 有一定的实用价值或内容质量</p>
      <p>3. 非纯广告站或违规站点</p>
      <p>4. 与现有分类匹配（影视、软件、工具、资讯等）</p>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 <a href="https://github.com/BYGD/dog-nav">DogNav</a> &middot; 狗狗导航</p>
  </footer>

  <button class="back-top" id="back-top" aria-label="回到顶部"></button>

  <script src="js/app.js"></script>
  <script>
    document.querySelector('.logo-icon').innerHTML = icons.dog;
    document.querySelector('.hamburger').innerHTML = icons.menu;
    document.querySelector('.mobile-nav-close').innerHTML = icons.x;
    document.querySelector('.back-top').innerHTML = icons.arrowUp;
  </script>
</body>
</html>
