<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>友情链接 - DogNav 狗狗导航</title>
  <link rel="icon" href="ico.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon"></span>
        <span class="logo-text">Dog<span>Nav</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="links.html" class="active">友链</a>
        <a href="about.html">关于</a>
        <a href="contribute.html">提交</a>
      </div>
      <div class="nav-right">
        <button class="hamburger" id="mobile-toggle" aria-label="菜单"></button>
      </div>
    </div>
  </nav>

  <div class="mobile-nav" id="mobile-nav">
    <button class="mobile-nav-close" id="mobile-close" aria-label="关闭"></button>
    <a href="index.html">首页</a>
    <a href="links.html">友链</a>
    <a href="about.html">关于</a>
    <a href="contribute.html">提交</a>
  </div>

  <section class="page-hero">
    <h1>友情链接</h1>
    <p>和优秀的导航站一起做朋友</p>
  </section>

  <div class="page-content">
    <div class="content-card reveal">
      <div class="link-grid">
        <a href="https://bygd.github.io/dog-nav" target="_blank" class="link-card">
          <img src="ico.ico" alt="DogNav">
          <div class="link-card-info">
            <div class="link-card-name">DogNav</div>
            <div class="link-card-desc">狗狗导航，精选每一个链接</div>
          </div>
        </a>
        <a href="https://www.52pojie.cn" target="_blank" class="link-card">
          <img src="ico/52.png" alt="吾爱破解">
          <div class="link-card-info">
            <div class="link-card-name">吾爱破解</div>
            <div class="link-card-desc">软件安全与逆向分析论坛</div>
          </div>
        </a>
        <a href="https://www.acoolnav.com" target="_blank" class="link-card">
          <img src="ico.ico" alt="阿酷导航">
          <div class="link-card-info">
            <div class="link-card-name">阿酷导航</div>
            <div class="link-card-desc">精选优质网站导航</div>
          </div>
        </a>
      </div>
    </div>

    <div class="content-card reveal">
      <h2>申请友链</h2>
      <p>如果你的网站是导航类、工具类或技术类站点，欢迎申请友情链接。</p>
      <p>请通过 GitHub Issues 提交申请，注明网站名称、链接和简介。</p>
      <a href="https://github.com/BYGD/dog-nav/issues" target="_blank" class="cta-btn" style="margin-top:16px;display:inline-flex">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        GitHub 申请
      </a>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; 2026 <a href="https://github.com/BYGD/dog-nav">DogNav</a> &middot; 狗狗导航</p>
  </footer>

  <button class="back-top" id="back-top" aria-label="回到顶部"></button>

  <script src="js/app.js"></script>
  <script>
    document.querySelector('.logo-icon').innerHTML = icons.dog;
    document.querySelector('.hamburger').innerHTML = icons.menu;
    document.querySelector('.mobile-nav-close').innerHTML = icons.x;
    document.querySelector('.back-top').innerHTML = icons.arrowUp;
  </script>
</body>
</html>
