<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DogNav - 狗狗导航 | 精选每一个链接</title>
  <meta name="description" content="DogNav 狗狗导航 — 精选优质网站，为你导航。影视、软件、工具、资讯一网打尽。">
  <meta name="keywords" content="导航,网站导航,狗狗导航,DogNav,影视,软件,工具">
  <meta property="og:title" content="DogNav - 狗狗导航">
  <meta property="og:description" content="精选每一个链接，为你导航">
  <meta property="og:type" content="website">
  <link rel="icon" href="ico.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Loading Screen -->
  <div class="loader" id="loader">
    <div class="loader-dots">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </div>

  <!-- Animated Background -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <span class="logo-icon"></span>
        <span class="logo-text">Dog<span>Nav</span></span>
      </a>
      <div class="nav-links">
        <a href="index.html" class="active">首页</a>
        <a href="links.html">友链</a>
        <a href="about.html">关于</a>
        <a href="contribute.html">提交</a>
      </div>
      <div class="nav-right">
        <div class="weather-widget" id="weather-widget">--</div>
        <button class="hamburger" id="mobile-toggle" aria-label="菜单"></button>
      </div>
    </div>
  </nav>

  <!-- Mobile Navigation -->
  <div class="mobile-nav" id="mobile-nav">
    <button class="mobile-nav-close" id="mobile-close" aria-label="关闭"></button>
    <a href="index.html">首页</a>
    <a href="links.html">友链</a>
    <a href="about.html">关于</a>
    <a href="contribute.html">提交</a>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-inner">
      <div class="hitokoto-box">
        <span id="hitokoto-text">加载中...</span>
        <span class="from" id="hitokoto-from"></span>
      </div>
      <div class="search-box">
        <form id="search-form" class="search-input-row">
          <span class="search-icon"></span>
          <input type="text" id="search-input" class="search-input" placeholder="搜索..." autocomplete="off">
          <button type="submit" class="search-btn">搜索</button>
        </form>
        <div class="search-groups" id="search-groups"></div>
        <div class="search-engines" id="search-engines"></div>
      </div>
    </div>
  </section>

  <!-- Category Filter Bar -->
  <div class="category-bar">
    <div class="category-bar-inner" id="category-filter"></div>
  </div>

  <!-- Main Content -->
  <main class="main">
    <div class="content">
      <div id="categories-container"></div>

      <!-- Friend Links -->
      <section class="friend-links reveal">
        <div class="cat-header">
          <span class="cat-title">友情链接</span>
        </div>
        <div class="friend-grid">
          <a href="https://bygd.github.io/dog-nav" target="_blank" class="friend-card">
            <img src="ico.ico" alt="DogNav">
            <span>DogNav</span>
          </a>
          <a href="https://www.52pojie.cn" target="_blank" class="friend-card">
            <img src="ico/52.png" alt="吾爱破解">
            <span>吾爱破解</span>
          </a>
          <a href="https://www.acoolnav.com" target="_blank" class="friend-card">
            <img src="ico.ico" alt="阿酷导航">
            <span>阿酷导航</span>
          </a>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 <a href="https://github.com/BYGD/dog-nav">DogNav</a> &middot; 狗狗导航 &middot; 精选每一个链接</p>
  </footer>

  <!-- Back to Top -->
  <button class="back-top" id="back-top" aria-label="回到顶部"></button>

  <script src="js/app.js"></script>
  <script>
    // Inject SVG icons into static elements
    document.querySelector('.logo-icon').innerHTML = icons.dog;
    document.querySelector('.search-icon').innerHTML = icons.search;
    document.querySelector('.hamburger').innerHTML = icons.menu;
    document.querySelector('.mobile-nav-close').innerHTML = icons.x;
    document.querySelector('.back-top').innerHTML = icons.arrowUp;
    document.querySelectorAll('.cat-header').forEach(h => {
      if (!h.querySelector('svg')) return;
    });
  </script>
</body>
</html>
